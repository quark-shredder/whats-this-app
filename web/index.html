<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fffbf1">
<title>What's this?</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/andika.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── home ───────────────────────────────────────────── -->
<section id="home" class="screen active">
  <h1 class="logo">What's this?</h1>
  <div class="menu">
    <button class="tile tile-ask"     data-go="ask">     <span class="emoji">📷</span><span>What's this?</span></button>
    <button class="tile tile-ambient" data-go="ambient"> <span class="emoji">👀</span><span>Look Around</span></button>
    <button class="tile tile-book"    data-go="book">    <span class="emoji">📖</span><span>My Book</span></button>
  </div>
  <button class="gear" data-go="voice" aria-label="Voice settings">⚙️</button>
</section>

<!-- ── camera (shared by ask + ambient) ────────────────── -->
<section id="camera" class="screen">
  <video id="video" playsinline muted autoplay></video>

  <!-- brackets mark the middle of the frame - the only part Pip actually looks at -->
  <div id="aim" class="aim"></div>

  <!-- the shot flies from full screen down onto the stack -->
  <img id="flyer" class="flyer" hidden alt="">

  <button class="back" data-go="home">←</button>
  <div id="livedot" class="livedot" hidden><span></span>Looking…</div>

  <div class="buddy" id="pip">
    <img class="hand hand-l" src="char/pink_hand_open.png" alt="">
    <img class="hand hand-r" src="char/pink_hand_open.png" alt="">
    <img class="body"        src="char/pink_body_squircle.png" alt="">
    <img class="face" id="buddyFace" src="char/face_h.png" alt="">
  </div>

  <div class="hud">
    <button id="photo" class="photo" hidden aria-label="Say it again">
      <span class="card back2"></span>
      <span class="card back1"></span>
      <img id="shot" class="card shot" alt="">
    </button>

    <div id="bubble" class="bubble" hidden>
      <div id="bar" class="bar" hidden><i></i></div>
      <p id="bubbleText" class="captiontext"></p>
      <button id="replay" class="replay" aria-label="Say it again">🔊</button>
    </div>

    <div class="btnrow">
      <button id="shutter" class="shutter" aria-label="Take a picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8.5h3.2l1.4-2h7.8l1.4 2H20a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5a1 1 0 0 1 1-1Z"/>
          <circle cx="12" cy="13.5" r="3.6"/>
        </svg>
      </button>
      <button id="pause" class="pause" hidden>⏸︎</button>
    </div>
  </div>
</section>

<!-- ── history ────────────────────────────────────────── -->
<section id="book" class="screen">
  <button class="back" data-go="home">←</button>
  <h2 class="booktitle">📖 My Book</h2>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>Nothing here yet!<br><small>Go find something 🔍</small></p>
</section>

<!-- ── voice settings (for the grown-up) ──────────────── -->
<section id="voice" class="screen">
  <button class="back" data-go="home">←</button>
  <h2 class="booktitle">🔊 Pip's Voice</h2>
  <div class="settings">
    <div id="conn" class="conn">Checking…</div>
    <details class="diag">
      <summary>What just happened</summary>
      <button id="clearLog" class="tiny">Clear</button>
      <pre id="logView" class="logview"></pre>
    </details>

    <h3 class="subhead">Voice</h3>
    <label class="row">
      <span>Speed <b id="rateVal"></b></span>
      <input id="rate" type="range" min="0.5" max="1.3" step="0.05">
    </label>
    <label class="row">
      <span>Pitch <b id="pitchVal"></b></span>
      <input id="pitch" type="range" min="0.6" max="1.8" step="0.05">
    </label>
    <p class="hint">Tap a voice to hear it</p>
    <div id="voiceList" class="voicelist"></div>

  </div>
</section>

<canvas id="canvas" hidden></canvas>
<canvas id="tiny" width="16" height="16" hidden></canvas>

<script src="app.js"></script>
</body>
</html>
