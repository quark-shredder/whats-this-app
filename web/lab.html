<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Detector lab</title>
<link rel="stylesheet" href="fonts/andika.css">
<style>
:root{
  --cream:#fffbf1; --butter:#fff2d0; --blush:#ffb2b2; --coral:#e36a6a;
  --ink:#5a3330; --pad:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{font:400 15px/1.4 "Andika",system-ui,sans-serif;color:var(--ink);user-select:none}
#video,#overlay{position:fixed;inset:0;width:100%;height:100%}
#video{object-fit:cover;background:#000}
#overlay{z-index:2}

.stats{
  position:fixed;top:max(8px,var(--pad));left:8px;right:8px;z-index:5;
  background:rgba(255,251,241,.93);border-radius:14px;padding:10px 12px;
  font:400 12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.stats b{color:var(--coral)}

.panel{
  position:fixed;left:8px;right:8px;bottom:max(8px,var(--pad));z-index:5;
  background:rgba(255,251,241,.95);border-radius:16px;padding:12px;
  display:flex;flex-direction:column;gap:9px;
  box-shadow:0 -4px 18px rgba(0,0,0,.3);
}
.row{display:flex;align-items:center;gap:8px}
.row label{font-size:12.5px;font-weight:700;min-width:74px}
.row input[type=range]{flex:1;accent-color:var(--coral);height:28px}
.row output{font:700 12.5px ui-monospace,monospace;min-width:52px;text-align:right;color:var(--coral)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:0;border-radius:99px;padding:8px 11px;background:var(--butter);color:var(--ink);
  font:700 12px "Andika",system-ui,sans-serif;
}
.chip.on{background:var(--coral);color:var(--cream)}
.hint{font-size:11.5px;opacity:.65;text-align:center}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="overlay"></canvas>
<div class="stats" id="stats">starting…</div>

<div class="panel">
  <div class="chips" id="models"></div>
  <div class="row">
    <label>threshold</label>
    <input id="thr" type="range" min="0.05" max="0.6" step="0.05" value="0.15">
    <output id="thrOut">0.15</output>
  </div>
  <div class="row">
    <label>merge at</label>
    <input id="merge" type="range" min="0.05" max="0.95" step="0.05" value="0.25">
    <output id="mergeOut">25%</output>
  </div>
  <div class="row">
    <label>tap slop</label>
    <input id="slop" type="range" min="0" max="70" step="2" value="34">
    <output id="slopOut">34px</output>
  </div>
  <div class="row">
    <label>circle</label>
    <input id="circ" type="range" min="0.08" max="0.45" step="0.01" value="0.20">
    <output id="circOut">20%</output>
  </div>
  <div class="row">
    <label>interval</label>
    <input id="ivl" type="range" min="60" max="600" step="20" value="180">
    <output id="ivlOut">180ms</output>
  </div>
  <div class="chips">
    <button class="chip on" id="fillBtn">fill</button>
    <button class="chip" id="labelBtn">labels</button>
    <button class="chip on" id="trackBtn">tracking</button>
    <button class="chip" id="rawBtn">raw</button>
    <button class="chip" id="resetBtn">reset</button>
    <button class="chip" id="slopBtn">tap range</button>
    <button class="chip" id="clearSel">clear pick</button>
  </div>
  <p class="hint">Tap to pick · tap again to send · tap empty space for your own circle</p>
</div>

<script type="module">
const video = document.getElementById('video');
const cv = document.getElementById('overlay');
const cx = cv.getContext('2d');
const statsEl = document.getElementById('stats');

const B = 'https://storage.googleapis.com/mediapipe-models/object_detector/';
const MODELS = {
  'ssd_mobilenet_v2':   B + 'ssd_mobilenet_v2/float16/1/ssd_mobilenet_v2.tflite',
  'efficientdet_lite0': B + 'efficientdet_lite0/float16/1/efficientdet_lite0.tflite',
  'efficientdet_lite2': B + 'efficientdet_lite2/float16/1/efficientdet_lite2.tflite',
};

const cfg = { model: 'ssd_mobilenet_v2', threshold: 0.15, interval: 180,
              tracking: true, showRaw: false,
              fill: true, labels: false, showSlop: false,
              mergeOverlap: 0.25, minFrac: 0.012, maxFrac: 0.7, maxAspect: 4,
              tapSlop: 34, circleFrac: 0.20 };

// ── stats ─────────────────────────────────────────────────
const S = {
  infer: [], detects: 0, renders: 0, dropped: 0,
  jitter: [], t0: performance.now(), lastDetect: 0
};
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const pct = (a, p) => { if (!a.length) return 0; const s = [...a].sort((x,y)=>x-y);
  return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };
function resetStats() {
  S.infer = []; S.detects = 0; S.renders = 0; S.dropped = 0;
  S.jitter = []; S.t0 = performance.now();
}

// ── tracking ──────────────────────────────────────────────
// Raw detections flicker: a box can vanish in the 300ms between a child
// deciding to tap and their finger landing. Tracks smooth over that.
let tracks = [];
let nextId = 1;
const APPEAR_AFTER = 2;      // detections in a row before we draw it
const EASE         = 0.18;   // gentler chase; measured jitter on a phone was 20px
// How long a track survives with no detection. Must scale with the detect
// interval: at a fixed 550ms, raising the interval to 300ms would kill a box
// after two misses, which is exactly when a child's finger is on its way down.
const keepMs = () => Math.max(500, cfg.interval * 3.5);

const iou = (a, b) => {
  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);
  const i = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return i / (a.w * a.h + b.w * b.h - i || 1);
};

// The detector returns four boxes for one suitcase - two classes, two sizes,
// nested. Rather than throwing the extras away and hoping the survivor is the
// right one, boxes that overlap are merged into a single region: the child sees
// one glowing thing and taps it once.
function overlapFrac(a, b) {
  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return inter / Math.min(a.w * a.h, b.w * b.h);
}

function dedupe(dets, vw, vh) {
  const area = vw * vh;
  const ok = dets.filter(d => {
    const f = (d.w * d.h) / area;
    // 4% of the frame was dropping cups and toys - the very things a child
    // points at. With tap tolerance a small region is still easy to hit.
    if (f < cfg.minFrac || f > cfg.maxFrac || d.w < 24 || d.h < 24) return false;
    // A long thin sliver is a wall edge or a bed rail, not a thing a child
    // points at - and left unchecked those outscore the real objects.
    return Math.max(d.w / d.h, d.h / d.w) <= cfg.maxAspect;
  });
  if (!ok.length) return [];

  // union-find: anything overlapping past the threshold joins the same region
  const parent = ok.map((_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const join = (i, j) => { const a = find(i), b = find(j); if (a !== b) parent[a] = b; };
  for (let i = 0; i < ok.length; i++)
    for (let j = i + 1; j < ok.length; j++)
      if (overlapFrac(ok[i], ok[j]) > cfg.mergeOverlap) join(i, j);

  const groups = new Map();
  ok.forEach((d, i) => {
    const k = find(i);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(d);
  });

  const regions = [];
  for (const members of groups.values()) {
    const x = Math.min(...members.map(m => m.x));
    const y = Math.min(...members.map(m => m.y));
    const x2 = Math.max(...members.map(m => m.x + m.w));
    const y2 = Math.max(...members.map(m => m.y + m.h));
    const best = members.reduce((a, b) => (b.score > a.score ? b : a));
    regions.push({ x, y, w: x2 - x, h: y2 - y,
                   label: best.label, score: best.score, members });
  }

  // Nearest the middle first - that is what the child is pointing at.
  const cxv = vw / 2, cyv = vh / 2;
  const rank = d => {
    const dx = (d.x + d.w / 2 - cxv) / vw, dy = (d.y + d.h / 2 - cyv) / vh;
    return d.score * (0.55 + 0.45 * (1 - Math.min(1, Math.hypot(dx, dy) * 1.6)));
  };
  return regions.sort((a, b) => rank(b) - rank(a));
}

function updateTracks(dets, now) {
  const used = new Set();
  for (const t of tracks) {
    let best = -1, bestIou = 0.3;
    dets.forEach((d, i) => {
      if (used.has(i)) return;
      const v = iou(t.raw, d);
      if (v > bestIou) { bestIou = v; best = i; }
    });
    if (best >= 0) {
      const d = dets[best]; used.add(best);
      S.jitter.push(Math.hypot(d.x - t.raw.x, d.y - t.raw.y));
      t.raw = d; t.label = d.label; t.score = d.score; t.members = d.members;
      t.seen++; t.lastSeen = now;
    }
  }
  dets.forEach((d, i) => {
    if (used.has(i)) return;
    tracks.push({ id: nextId++, raw: d, draw: { ...d }, label: d.label,
                  score: d.score, members: d.members, seen: 1, lastSeen: now });
  });
  tracks = tracks.filter(t => now - t.lastSeen < keepMs());
}

// ── detector ──────────────────────────────────────────────
let detector = null, busy = false, lastRun = 0, vision = null, fileset = null;

async function loadDetector(name) {
  statsEl.textContent = 'loading ' + name + '…';
  if (!vision) {
    vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18');
    fileset = await vision.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');
  }
  const old = detector; detector = null;
  if (old) old.close();
  detector = await vision.ObjectDetector.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODELS[name], delegate: 'GPU' },
    scoreThreshold: cfg.threshold, maxResults: 10, runningMode: 'VIDEO'
  });
  tracks = []; resetStats();
}

async function maybeDetect(now) {
  if (!detector || busy) { if (detector) S.dropped++; return; }
  if (now - lastRun < cfg.interval) return;
  if (!video.videoWidth) return;
  busy = true; lastRun = now;
  try {
    const t = performance.now();
    const res = detector.detectForVideo(video, now);
    const ms = performance.now() - t;
    S.infer.push(ms); if (S.infer.length > 120) S.infer.shift();
    S.detects++;
    const dets = (res.detections || []).map(d => ({
      x: d.boundingBox.originX, y: d.boundingBox.originY,
      w: d.boundingBox.width,   h: d.boundingBox.height,
      label: d.categories[0]?.categoryName || '?',
      score: d.categories[0]?.score || 0
    }));
    const clean = dedupe(dets, video.videoWidth, video.videoHeight);
    if (cfg.tracking) updateTracks(clean, now);
    else tracks = clean.map((d, i) => ({ id: i, raw: d, draw: d, label: d.label,
                                         score: d.score, members: d.members,
                                         seen: 99, lastSeen: now }));
    lastRaw = dets;
  } catch (e) { statsEl.textContent = 'detect failed: ' + e.message; }
  busy = false;
}
let lastRaw = [];

// ── drawing ───────────────────────────────────────────────
function fit() {
  cv.width = cv.clientWidth * devicePixelRatio;
  cv.height = cv.clientHeight * devicePixelRatio;
}
addEventListener('resize', fit);

// video is object-fit:cover, so map model coords -> screen coords
function mapper() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const cw = cv.width, ch = cv.height;
  const scale = Math.max(cw / vw, ch / vh);
  const dx = (cw - vw * scale) / 2, dy = (ch - vh * scale) / 2;
  return (x, y, w, h) => [x * scale + dx, y * scale + dy, w * scale, h * scale];
}

// mapper() goes video -> screen; this is the way back, for turning a tap into
// a region of the actual frame.
function unmapper() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(cv.width / vw, cv.height / vh);
  const dx = (cv.width - vw * scale) / 2, dy = (cv.height - vh * scale) / 2;
  return (px, py) => [(px - dx) / scale, (py - dy) / scale];
}

/* ── what the child has chosen ──────────────────────────────
   A tap either picks one of the model's highlights or, on empty space, draws
   the child's own circle. Their circle always wins over anything it covers -
   they are pointing at something the detector missed or split up. */
let ripples = [];          // {x, y, t0} in canvas pixels
let manual = null;         // {x, y, r} in video pixels
let selected = null;       // {kind:'track'|'manual', id}

const manualBox = m => ({ x: m.x - m.r, y: m.y - m.r, w: m.r * 2, h: m.r * 2 });

// How far outside a highlight a tap still counts. A small finger aiming at a
// small thing lands just outside the line more often than on it.
function nearestTrack(vx, vy, slopVideo) {
  let best = null, bestD = Infinity;
  for (const t of visibleTracks()) {
    const b = t.draw;
    const dx = Math.max(b.x - vx, 0, vx - (b.x + b.w));
    const dy = Math.max(b.y - vy, 0, vy - (b.y + b.h));
    const d = Math.hypot(dx, dy);
    if (d <= slopVideo && d < bestD) { bestD = d; best = t; }
  }
  return best;
}

function visibleTracks() {
  const list = tracks.filter(t => t.seen >= APPEAR_AFTER);
  if (!manual) return list;
  // the child's circle takes precedence over anything it substantially covers
  const mb = manualBox(manual);
  return list.filter(t => {
    const x1 = Math.max(t.draw.x, mb.x), y1 = Math.max(t.draw.y, mb.y);
    const x2 = Math.min(t.draw.x + t.draw.w, mb.x + mb.w);
    const y2 = Math.min(t.draw.y + t.draw.h, mb.y + mb.h);
    const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
    return inter / (t.draw.w * t.draw.h) < 0.5;
  });
}

function draw() {
  S.renders++;
  cx.clearRect(0, 0, cv.width, cv.height);
  if (!video.videoWidth) return;
  const map = mapper();

  if (cfg.showRaw) {
    cx.strokeStyle = 'rgba(255,255,255,.45)'; cx.lineWidth = 1 * devicePixelRatio;
    cx.setLineDash([4 * devicePixelRatio, 4 * devicePixelRatio]);
    for (const d of lastRaw) { const [x,y,w,h] = map(d.x,d.y,d.w,d.h); cx.strokeRect(x,y,w,h); }
    cx.setLineDash([]);
  }

  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 620);

  for (const t of visibleTracks()) {
    // ease the drawn box toward the real one
    t.draw.x += (t.raw.x - t.draw.x) * EASE;
    t.draw.y += (t.raw.y - t.draw.y) * EASE;
    t.draw.w += (t.raw.w - t.draw.w) * EASE;
    t.draw.h += (t.raw.h - t.draw.h) * EASE;

    const [x, y, w, h] = map(t.draw.x, t.draw.y, t.draw.w, t.draw.h);
    const dpr = devicePixelRatio;
    // Offset the member boxes by however far the smoothed region has drifted
    // from the raw one, so the merged shape eases as a whole.
    const ox = t.draw.x - t.raw.x, oy = t.draw.y - t.raw.y;
    const parts = (t.members && t.members.length ? t.members : [t.raw]);

    // ONE path for every part, filled ONCE - fill them separately and the
    // overlaps stack into dark patches instead of reading as a single thing.
    cx.beginPath();
    for (const m of parts) {
      const [mx, my, mw, mh] = map(m.x + ox, m.y + oy, m.w, m.h);
      cx.roundRect(mx, my, mw, mh, Math.min(mw, mh) * 0.24);
    }

    if (cfg.showSlop) {
      const slopPx = cfg.tapSlop * dpr;
      cx.save();
      cx.strokeStyle = 'rgba(120,220,255,.75)';
      cx.lineWidth = 1.5 * dpr;
      cx.setLineDash([6 * dpr, 6 * dpr]);
      for (const m of parts) {
        const [mx, my, mw, mh] = map(m.x + ox, m.y + oy, m.w, m.h);
        cx.strokeRect(mx - slopPx, my - slopPx, mw + slopPx * 2, mh + slopPx * 2);
      }
      cx.restore();
    }

    if (selected && selected.kind === 'track' && selected.id === t.id) {
      cx.strokeStyle = '#fffbf1';
      cx.lineWidth = 5 * dpr;
      cx.setLineDash([10 * dpr, 7 * dpr]);
      cx.lineDashOffset = -performance.now() / 26;
      cx.stroke();
      cx.setLineDash([]);
    }

    if (cfg.labels) {
      const label = `${t.label} ${(t.score*100)|0}%`;
      cx.font = `${13 * dpr}px Andika, system-ui`;
      const tw = cx.measureText(label).width + 12 * dpr;
      const ly = Math.max(0, y - 22 * dpr);
      cx.fillStyle = 'rgba(255,251,241,.92)';
      cx.beginPath(); cx.roundRect(x, ly, tw, 20 * dpr, 8 * dpr); cx.fill();
      cx.fillStyle = '#5a3330';
      cx.fillText(label, x + 6 * dpr, ly + 14.5 * dpr);
    }
  }

  // the child's own circle
  if (manual) {
    const [mx, my, mw] = map(manual.x - manual.r, manual.y - manual.r, manual.r * 2, manual.r * 2);
    const cxp = mx + mw / 2, cyp = my + mw / 2, rp = mw / 2;
    const dpr = devicePixelRatio;
    const g = cx.createRadialGradient(cxp, cyp, rp * 0.08, cxp, cyp, rp);
    const a1 = 0.34 + 0.10 * pulse;
    g.addColorStop(0,   `rgba(255,226,150,${a1})`);
    g.addColorStop(0.62,`rgba(255,178,178,${a1 * 0.7})`);
    g.addColorStop(1,   'rgba(227,106,106,0)');
    cx.beginPath(); cx.arc(cxp, cyp, rp, 0, Math.PI * 2);
    cx.fillStyle = g; cx.fill();

    const chosen = selected && selected.kind === 'manual';
    cx.strokeStyle = chosen ? '#fffbf1' : `rgba(255,251,241,${0.6 + 0.2 * pulse})`;
    cx.lineWidth = (chosen ? 5 : 3) * dpr;
    if (chosen) { cx.setLineDash([10 * dpr, 7 * dpr]); cx.lineDashOffset = -performance.now() / 26; }
    cx.stroke();
    cx.setLineDash([]);
  }

  // touch ripples - proof the tap landed, wherever it landed
  const now = performance.now();
  ripples = ripples.filter(r => now - r.t0 < 620);
  for (const r of ripples) {
    const k = (now - r.t0) / 620;
    const rad = (18 + k * 88) * devicePixelRatio;
    cx.beginPath(); cx.arc(r.x, r.y, rad, 0, Math.PI * 2);
    cx.strokeStyle = `rgba(255,251,241,${(1 - k) * 0.85})`;
    cx.lineWidth = (3.5 * (1 - k) + 1) * devicePixelRatio;
    cx.stroke();
  }
}

// ── the loop ──────────────────────────────────────────────
let lastFrameAt = 0, looping = false;

function frame(now) {
  lastFrameAt = performance.now();
  maybeDetect(now);
  draw();
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(frame);
  else requestAnimationFrame(frame);
}

// rVFC and rAF both stop in a backgrounded tab, which kills the loop for good.
// A watchdog restarts it, so the page recovers on its own.
function startLoop() {
  if (looping) return;
  looping = true;
  frame(performance.now());
}
setInterval(() => {
  if (performance.now() - lastFrameAt > 1000 && document.visibilityState === 'visible') {
    looping = false; startLoop();
  }
}, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { looping = false; startLoop(); }
});

// ── readout ───────────────────────────────────────────────
let battery = null;
navigator.getBattery && navigator.getBattery().then(b => battery = b).catch(()=>{});
setInterval(() => {
  const secs = (performance.now() - S.t0) / 1000;
  const shown = tracks.filter(t => t.seen >= APPEAR_AFTER).length;
  statsEl.innerHTML =
    `${cfg.model}  thr ${cfg.threshold}  every ${cfg.interval}ms\n` +
    `infer   <b>${mean(S.infer).toFixed(1)}ms</b>  p90 ${pct(S.infer,.9).toFixed(0)}ms  max ${Math.max(0,...S.infer).toFixed(0)}ms\n` +
    `detect  <b>${(S.detects/secs).toFixed(1)}/s</b>   render ${(S.renders/secs).toFixed(0)}/s   skipped ${S.dropped}\n` +
    `regions <b>${shown}</b> shown, ${tracks.length} tracked` +
    `  (${tracks.reduce((n,t)=>n+((t.members&&t.members.length)||1),0)} raw boxes merged)\n` +
    `jitter  <b>${mean(S.jitter).toFixed(1)}px</b>  p90 ${pct(S.jitter,.9).toFixed(0)}px\n` +
    `ran     ${secs.toFixed(0)}s` +
    (battery ? `   battery ${(battery.level*100)|0}%${battery.charging?' (charging)':''}` : '');
}, 500);

// ── controls ──────────────────────────────────────────────
const modelsEl = document.getElementById('models');
for (const name of Object.keys(MODELS)) {
  const b = document.createElement('button');
  b.className = 'chip' + (name === cfg.model ? ' on' : '');
  b.textContent = name.replace('efficientdet_', 'effdet_');
  b.onclick = async () => {
    cfg.model = name;
    [...modelsEl.children].forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    await loadDetector(name);
  };
  modelsEl.append(b);
}
const thr = document.getElementById('thr'), thrOut = document.getElementById('thrOut');
thr.oninput = () => thrOut.textContent = (+thr.value).toFixed(2);
thr.onchange = async () => { cfg.threshold = +thr.value; await loadDetector(cfg.model); };
const ivl = document.getElementById('ivl'), ivlOut = document.getElementById('ivlOut');
ivl.oninput = () => { cfg.interval = +ivl.value; ivlOut.textContent = ivl.value + 'ms'; };
const merge = document.getElementById('merge'), mergeOut = document.getElementById('mergeOut');
merge.oninput = () => {
  cfg.mergeOverlap = +merge.value;
  mergeOut.textContent = Math.round(merge.value * 100) + '%';
};
document.getElementById('fillBtn').onclick = e => {
  cfg.fill = !cfg.fill; e.target.classList.toggle('on', cfg.fill);
};
document.getElementById('labelBtn').onclick = e => {
  cfg.labels = !cfg.labels; e.target.classList.toggle('on', cfg.labels);
};
document.getElementById('trackBtn').onclick = e => {
  cfg.tracking = !cfg.tracking; tracks = [];
  e.target.classList.toggle('on', cfg.tracking);
};
document.getElementById('rawBtn').onclick = e => {
  cfg.showRaw = !cfg.showRaw; e.target.classList.toggle('on', cfg.showRaw);
};
document.getElementById('resetBtn').onclick = resetStats;
document.getElementById('clearSel').onclick = () => { manual = null; selected = null; };
document.getElementById('slopBtn').onclick = e => {
  cfg.showSlop = !cfg.showSlop; e.target.classList.toggle('on', cfg.showSlop);
};
const slop = document.getElementById('slop'), slopOut = document.getElementById('slopOut');
slop.oninput = () => { cfg.tapSlop = +slop.value; slopOut.textContent = slop.value + 'px'; };
const circ = document.getElementById('circ'), circOut = document.getElementById('circOut');
circ.oninput = () => {
  cfg.circleFrac = +circ.value; circOut.textContent = Math.round(circ.value*100) + '%';
  if (manual) manual.r = Math.min(video.videoWidth, video.videoHeight) * cfg.circleFrac / 2;
};

/* ── the tap ────────────────────────────────────────────────
   First tap chooses: a highlight if one is near enough, otherwise the child's
   own circle right where they touched. Second tap on the same thing sends it.
   Every tap ripples, so a tap never feels ignored even when nothing is hit. */
function cropFrom(box, pad = 0.12) {
  const c = document.createElement('canvas');
  const sx = Math.max(0, box.x - box.w * pad), sy = Math.max(0, box.y - box.h * pad);
  const sw = Math.min(video.videoWidth  - sx, box.w * (1 + 2 * pad));
  const sh = Math.min(video.videoHeight - sy, box.h * (1 + 2 * pad));
  c.width = 320; c.height = Math.max(1, Math.round(320 * sh / sw));
  c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
}

function sendCrop(box, what) {
  const url = cropFrom(box);
  const w = window.open('', '_blank');
  if (w) w.document.write(`<title>crop</title><body style="margin:0;background:#111">
    <img src="${url}" style="width:100%">
    <p style="color:#eee;font:14px system-ui;padding:10px">${what} — this is what Gemma would see</p>`);
}

function handleTap(clientX, clientY) {
  const rect = cv.getBoundingClientRect();
  const px = (clientX - rect.left) * devicePixelRatio;
  const py = (clientY - rect.top)  * devicePixelRatio;
  ripples.push({ x: px, y: py, t0: performance.now() });
  if (!video.videoWidth) return;

  const [vx, vy] = unmapper()(px, py);
  const scale = Math.max(cv.width / video.videoWidth, cv.height / video.videoHeight);
  const slopVideo = (cfg.tapSlop * devicePixelRatio) / scale;

  // already have a circle, and they tapped it again -> that is the answer
  if (manual) {
    const d = Math.hypot(vx - manual.x, vy - manual.y);
    if (d <= manual.r + slopVideo) {
      if (selected && selected.kind === 'manual') { sendCrop(manualBox(manual), 'your circle'); return; }
      selected = { kind: 'manual' }; return;
    }
  }

  // a highlight near the finger, not necessarily under it
  const hit = nearestTrack(vx, vy, slopVideo);
  if (hit) {
    if (selected && selected.kind === 'track' && selected.id === hit.id) {
      sendCrop(hit.draw, hit.label); return;
    }
    selected = { kind: 'track', id: hit.id }; return;
  }

  // empty space: draw their own circle here
  const r = Math.min(video.videoWidth, video.videoHeight) * cfg.circleFrac / 2;
  manual = { x: vx, y: vy, r };
  selected = { kind: 'manual' };
}

cv.addEventListener('pointerdown', ev => handleTap(ev.clientX, ev.clientY));

// exposed so the tracking can be driven deterministically in a test
window.__lab = {
  cfg, S,
  get tracks() { return tracks; },
  set tracks(v) { tracks = v; },
  updateTracks, iou, dedupe, resetStats, handleTap, visibleTracks, nearestTrack,
  get manual(){return manual}, set manual(v){manual=v},
  get selected(){return selected}, set selected(v){selected=v},
  APPEAR_AFTER, keepMs
};

// ── go ────────────────────────────────────────────────────
(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    fit();
    await loadDetector(cfg.model);
    startLoop();
  } catch (e) { statsEl.textContent = 'camera failed: ' + e.message; }
})();
</script>
